<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Offline - Event Registration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      color: #18181b;
      padding: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #27272a; color: #f4f4f5; }
    }
    .card {
      width: 100%;
      max-width: 28rem;
      padding: 1.5rem;
      background: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      border: 1px solid #e4e4e7;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #18181b; border-color: #27272a; }
    }
    .icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto;
      border-radius: 50%;
      background: #fef3c7;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @media (prefers-color-scheme: dark) {
      .icon { background: rgba(251, 146, 60, 0.15); }
    }
    .icon svg { width: 2rem; height: 2rem; color: #d97706; }
    @media (prefers-color-scheme: dark) {
      .icon svg { color: #fbbf24; }
    }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .desc { font-size: 0.875rem; color: #71717a; line-height: 1.6; }
    @media (prefers-color-scheme: dark) {
      .desc { color: #a1a1aa; }
    }
    .info {
      padding: 1rem;
      background: #fafafa;
      border-radius: 0.75rem;
      border: 1px solid #e4e4e7;
      font-size: 0.75rem;
      color: #52525b;
      text-align: left;
      line-height: 1.8;
    }
    @media (prefers-color-scheme: dark) {
      .info { background: rgba(39, 39, 42, 0.6); border-color: rgba(63, 63, 70, 0.8); color: #a1a1aa; }
    }
    .info strong { color: #27272a; }
    @media (prefers-color-scheme: dark) {
      .info strong { color: #e4e4e7; }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.625rem 1rem;
      background: #18181b;
      color: #fff;
      font-weight: 500;
      font-size: 0.875rem;
      border: none;
      border-radius: 0.5rem;
      text-decoration: none;
      text-align: center;
      transition: background 0.15s;
      cursor: pointer;
    }
    .btn:hover { background: #27272a; }
    @media (prefers-color-scheme: dark) {
      .btn { background: #f4f4f5; color: #18181b; }
      .btn:hover { background: #e4e4e7; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m-2.829-2.829a5 5 0 000-7.07m-4.243 4.243a1 1 0 010-1.414" />
      </svg>
    </div>

    <div>
      <h1>You Are Offline</h1>
      <p class="desc">
        Internet connection lost. Don&apos;t worry &mdash; you can still submit
        registration data. It will sync automatically when you&apos;re back online.
      </p>
    </div>

    <div class="info">
      <strong>How it works:</strong><br>
      1. Fill in the registration form<br>
      2. Data is saved locally on your device<br>
      3. Auto-syncs when connection is restored
    </div>

    <a href="/" class="btn">Try Again</a>
  </div>
</body>
</html>
